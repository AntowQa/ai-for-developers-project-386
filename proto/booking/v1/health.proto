syntax = "proto3";

package booking.v1;

option go_package = "github.com/AntowQa/ai-for-developers-project-386/api/gen/booking/v1;bookingv1";

import "google/api/annotations.proto";

// HealthService reports whether the API can reach PostgreSQL.
service HealthService {
  // Check pings PostgreSQL and returns OK when the database accepts connections.
  rpc Check(CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {get: "/api/health"};
  }
}

message CheckRequest {}

message CheckResponse {
  string status = 1;
}
