[tools]
go = "1.26.1"
node = "24.14.0"
pnpm = "10.26.0"
buf = "1.57.2"
golangci-lint = "2.11.2"
hk = "2.14.0"

[env]
DATABASE_URL = "postgres://booking:booking@127.0.0.1:54329/booking?sslmode=disable"

[tasks.setup]
description = "Install dependencies and git hooks"
run = """
set -eu
(cd api && go mod download)
(cd web && pnpm install --frozen-lockfile)
(cd tools/sdkgen && pnpm install --frozen-lockfile)
hk install
"""

[tasks.check]
description = "Regenerate contracts, lint, test, and build"
run = "scripts/check.sh"
