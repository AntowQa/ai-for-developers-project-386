openapi: 3.0.0
info:
  title: Booking API
  version: 0.0.0
tags: []
paths:
  /api/health:
    get:
      operationId: checkHealth
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseUnavailable'
components:
  schemas:
    DatabaseUnavailable:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: number
          enum:
            - 14
        message:
          type: string
          enum:
            - database unavailable
        details:
          type: array
          items: {}
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
